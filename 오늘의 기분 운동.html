<title>오늘의 기분 운동</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 열(최대 760px). 위에서부터 기분 버튼 → 오늘의 한마디 → 30분 운동(타이머 + 순서). 기분마다 차분한 포인트 색이 바뀝니다. */
:root {
  --bg: #F0F4F3;
  --surface: #FFFFFF;
  --ink: #1F2B2C;
  --muted: #526466;
  --line: #D3DDDB;
  --soft: #E6EDEB;
  --on-m: #FFFFFF;
  --font-display: 'Gowun Batang', 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --font-body: 'Gowun Dodum', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --c-energy: #8F6228;
  --c-calm: #3F7A74;
  --c-tired: #4A6E94;
  --c-low: #7B5C8E;
  --c-stress: #A4524A;
  --c-start: #5E7A3E;
  --m: var(--c-calm);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101819; --surface: #182324; --ink: #E4EDEB; --muted: #9DB0AD; --line: #2B3B3C; --soft: #203031; --on-m: #101819;
    --c-energy: #D4A66A; --c-calm: #7FBDB5; --c-tired: #8FB0D4; --c-low: #BFA3D0; --c-stress: #D69A92; --c-start: #A9C487;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101819; --surface: #182324; --ink: #E4EDEB; --muted: #9DB0AD; --line: #2B3B3C; --soft: #203031; --on-m: #101819;
  --c-energy: #D4A66A; --c-calm: #7FBDB5; --c-tired: #8FB0D4; --c-low: #BFA3D0; --c-stress: #D69A92; --c-start: #A9C487;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.7;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid color-mix(in srgb, var(--m) 70%, transparent); outline-offset: 3px; }

/* 상단 */
.top { display: grid; gap: 6px; }
.kicker { margin: 0; font-size: 1rem; color: var(--muted); letter-spacing: 0.04em; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.25; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 1.1rem; }

/* 기분 버튼 */
.moods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .moods { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mood {
  min-height: 124px;
  display: grid; place-items: center; align-content: center; gap: 8px;
  padding: 16px 10px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 20px;
  color: var(--ink);
  text-align: center;
  transition: background-color .2s, border-color .2s;
}
.mood svg { width: 48px; height: 48px; color: var(--mc); }
.mood span { font-size: 1.25rem; line-height: 1.3; }
.mood:hover { border-color: var(--mc); }
.mood[aria-pressed="true"] {
  border-color: var(--mc);
  background: color-mix(in srgb, var(--mc) 16%, var(--surface));
}

/* 오늘의 한마디 */
.quote {
  background: color-mix(in srgb, var(--m) 13%, var(--surface));
  border-radius: 24px;
  padding: 26px 22px 22px;
  display: grid; gap: 14px;
}
.qm { font-family: var(--font-display); font-size: 3.75rem; line-height: .6; color: var(--m); height: 30px; }
.qtext { margin: 0; font-family: var(--font-display); font-size: clamp(1.5rem, 5.4vw, 1.9rem); line-height: 1.6; text-wrap: balance; }
.qby { margin: 0; color: var(--muted); font-size: 1.1rem; }
.qfoot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 6px; }
.qcount { margin: 0; color: var(--muted); font-size: 1rem; }

/* 버튼 */
.btn {
  min-height: 58px; padding: 0 28px;
  border-radius: 999px;
  font-size: 1.2rem;
  border: 2px solid var(--line);
  background: transparent;
  color: var(--ink);
}
.btn.primary { background: var(--m); border-color: var(--m); color: var(--on-m); }
.btn:hover { filter: brightness(0.96); }
.btn:active { transform: translateY(1px); }

/* 운동 계획 */
.plan { display: grid; gap: 18px; min-width: 0; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 5.6vw, 2rem); line-height: 1.3; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chiplabel { color: var(--muted); font-size: 1rem; margin-right: 4px; }
.chip { padding: 4px 14px; border-radius: 999px; font-size: 1.05rem; background: color-mix(in srgb, var(--m) 16%, var(--surface)); }
.chip.tool { background: transparent; border: 1.5px solid var(--line); }

/* 타이머 */
.timer { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 22px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.tstep { margin: 0; color: var(--muted); font-size: 1.05rem; }
.tname { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 5.4vw, 1.85rem); line-height: 1.3; }
.ttool { margin: 0; color: var(--muted); }
.ttime { font-size: clamp(3.75rem, 19vw, 5.5rem); line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.bar { width: 100%; height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--m); border-radius: 5px; transition: width .4s linear; }
.tall { margin: 0; color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }
.tbtns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; }
.tbtns .btn.primary { min-width: 170px; }
.tdone { margin: 0; font-size: 1.2rem; }

/* 동작 목록 */
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.row {
  width: 100%; text-align: left; background: transparent; border: 0; border-radius: 16px;
  padding: 16px 12px;
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: start;
}
.row[aria-current="step"] { background: color-mix(in srgb, var(--m) 14%, var(--surface)); }
.mins { text-align: center; background: var(--soft); border-radius: 12px; padding: 6px 0; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.rname { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1.4; }
.rtool { margin: 0; color: var(--muted); font-size: 1rem; }
.rhow { margin: 4px 0 0; font-size: 1.1rem; line-height: 1.75; }
.row.done { opacity: .6; }
.row.done .mins::after { content: " ✓"; }

.note { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.75; }

@media (prefers-reduced-motion: reduce) {
  .bar > i, .mood { transition: none; }
}
</style>

<main class="wrap">
  <header class="top">
    <p class="kicker">하루 30분 · 덤벨 · 요가매트 · 실내자전거</p>
    <h1>오늘은 어떤 기분이세요?</h1>
    <p class="sub">기분을 누르면 마음에 닿는 한마디와 오늘의 30분 운동이 나와요.</p>
  </header>

  <div class="moods" id="moods" role="group" aria-label="오늘의 기분 고르기"></div>

  <section class="quote" id="quote" aria-live="polite">
    <div class="qm" aria-hidden="true">“</div>
    <p class="qtext" id="qText"></p>
    <p class="qby" id="qBy"></p>
    <div class="qfoot">
      <button class="btn" id="qNext" type="button">다른 한마디 보기</button>
      <p class="qcount" id="qCount"></p>
    </div>
  </section>

  <section class="plan" aria-labelledby="planTitle">
    <h2 id="planTitle"></h2>
    <p class="lead" id="planLead"></p>
    <div class="chiprow" id="focusRow"></div>
    <div class="chiprow" id="toolRow"></div>

    <div class="timer">
      <p class="tstep" id="tStep"></p>
      <p class="tname" id="tName"></p>
      <p class="ttool" id="tTool"></p>
      <div class="ttime" id="tTime" role="timer" aria-live="off">00:00</div>
      <div class="bar" aria-hidden="true"><i id="tBar"></i></div>
      <p class="tall" id="tAll"></p>
      <p class="tdone" id="tDone" hidden>오늘 운동 끝! 정말 수고하셨어요.</p>
      <div class="tbtns">
        <button class="btn primary" id="tGo" type="button">시작하기</button>
        <button class="btn" id="tNext" type="button">다음 동작</button>
        <button class="btn" id="tReset" type="button">처음부터</button>
      </div>
    </div>

    <ol class="steps" id="steps"></ol>
  </section>

  <p class="note">통증이 느껴지면 바로 멈추고, 몸 상태에 맞게 강도를 조절해 주세요. 덤벨은 편하게 들 수 있는 가벼운 무게로 시작하세요. 마음이 오래 무거울 때는 믿을 수 있는 사람이나 전문가와 이야기해 보세요.</p>
</main>

    document.documentElement.style.setProperty('--m', 'var(' + m.color + ')');
    var btns = $('moods').children;
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].dataset.key === m.key ? 'true' : 'false');
    showQuote();
    renderPlan();
    if (fromUser) {
      $('quote').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    }
  }

  /* 무작위 한마디: 한 바퀴 다 돌 때까지 겹치지 않게 */
  function drawQuote() {
    var m = cur(), bag = bags[m.key] || [];
    if (!bag.length) {
      bag = shuffle(m.deck.map(function (_, i) { return i; }));
      if (bag.length > 1 && bag[bag.length - 1] === lastQ[m.key]) bag.unshift(bag.pop());
    }
    var i = bag.pop(); bags[m.key] = bag; lastQ[m.key] = i;
    return m.deck[i];
  }
  function showQuote() {
    var q = drawQuote(), m = cur();
    $('qText').textContent = q.t;
    $('qBy').textContent = q.a ? '— ' + q.a : '오늘의 한마디';
    $('qCount').textContent = m.label + ' · ' + m.deck.length + '개의 말 중 무작위';
  }

  /* 운동 계획 */
  function chips(el, label, items, cls) {
    el.innerHTML = '<span class="chiplabel">' + label + '</span>';
    items.forEach(function (t) { var s = document.createElement('span'); s.className = 'chip ' + (cls || ''); s.textContent = t; el.appendChild(s); });
  }
  function renderPlan() {
    var m = cur();
    $('planTitle').textContent = m.title;
    $('planLead').textContent = m.lead;
    chips($('focusRow'), '집중 부위', m.focus, '');
    var tools = [];
    m.steps.forEach(function (s) { var n = TOOL[s.tool]; if (tools.indexOf(n) < 0) tools.push(n); });
    chips($('toolRow'), '준비물', tools, 'tool');
    renderSteps(); updateTimer();
  }
  function renderSteps() {
    var m = cur(), ol = $('steps'); ol.innerHTML = '';
    m.steps.forEach(function (s, i) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'row' + (state.done || i < state.idx ? ' done' : '');
      if (!state.done && i === state.idx) b.setAttribute('aria-current', 'step');
      b.innerHTML = '<span class="mins">' + s.min + '분</span><span><p class="rname"></p><p class="rtool"></p><p class="rhow"></p></span>';
      b.querySelector('.rname').textContent = s.n;
      b.querySelector('.rtool').textContent = TOOL[s.tool];
      b.querySelector('.rhow').textContent = s.how;
      b.addEventListener('click', function () { goStep(i); });
      li.appendChild(b); ol.appendChild(li);
    });
  }

  /* 타이머 */
  function elapsed() {
    var m = cur(), e = 0;
    if (state.done) return m.total;
    for (var i = 0; i < state.idx; i++) e += m.steps[i].min * 60;
    return e + (stepDur(state.idx) - state.remaining);
  }
  function updateTimer() {
    var m = cur(), s = m.steps[state.idx];
    $('tStep').textContent = state.done ? '모든 동작 완료' : '지금 동작 · ' + (state.idx + 1) + ' / ' + m.steps.length;
    $('tName').textContent = state.done ? '수고하셨어요' : s.n;
    $('tTool').textContent = state.done ? '' : TOOL[s.tool] + ' · ' + s.min + '분';
    $('tTime').textContent = fmt(state.done ? 0 : state.remaining);
    var e = elapsed();
    $('tBar').style.width = (e / m.total * 100) + '%';
    $('tAll').textContent = '전체 ' + fmt(m.total) + ' 중 ' + fmt(e) + ' 지났어요';
    $('tDone').hidden = !state.done;
    $('tGo').textContent = state.done ? '다시 하기' : (state.running ? '잠깐 멈춤' : (e > 0 ? '이어서 하기' : '시작하기'));
    $('tNext').disabled = state.done;
    $('tNext').style.opacity = state.done ? '.4' : '1';
  }
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 620; g.gain.value = 0.07;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.2);
    } catch (e) {}
  }
  function lockScreen() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {}); } catch (e) {}
  }
  function unlockScreen() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {} }
  function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } state.running = false; unlockScreen(); }

  function start() {
    if (state.done) { reset(); }
    try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    state.running = true;
    state.endAt = Date.now() + state.remaining * 1000;
    state.timerId = setInterval(tick, 250);
    lockScreen();
    updateTimer();
  }
  function pause() { stopTimer(); updateTimer(); }
  function tick() {
    var left = Math.max(0, Math.ceil((state.endAt - Date.now()) / 1000));
    state.remaining = left;
    if (left <= 0) { advance(); return; }
    updateTimer();
  }
  function advance() {
    var m = cur();
    if (state.idx >= m.steps.length - 1) { finish(); return; }
    state.idx++;
    state.remaining = stepDur(state.idx);
    state.endAt = Date.now() + state.remaining * 1000;
    beep(); renderSteps(); updateTimer();
  }
  function finish() {
    stopTimer(); state.done = true; state.remaining = 0;
    beep(); renderSteps(); updateTimer();
  }
  function goStep(i) {
    if (state.done) { state.done = false; }
    state.idx = i; state.remaining = stepDur(i);
    if (state.running) state.endAt = Date.now() + state.remaining * 1000;
    renderSteps(); updateTimer();
  }
  function reset() {
    stopTimer(); state.done = false; state.idx = 0; state.remaining = stepDur(0);
    renderSteps(); updateTimer();
  }

  $('qNext').addEventListener('click', showQuote);
  $('tGo').addEventListener('click', function () {
    if (state.done) { reset(); start(); }
    else if (state.running) pause(); else start();
  });
  $('tNext').addEventListener('click', function () {
    if (state.done) return;
    if (state.idx >= cur().steps.length - 1) { finish(); return; }
    goStep(state.idx + 1);
  });
  $('tReset').addEventListener('click', reset);

  renderMoods();
  var saved = null;
  try { saved = localStorage.getItem('mood-workout:last'); } catch (e) {}
  selectMood(saved || 'calm', false);
})();
</script>

</body></html>
